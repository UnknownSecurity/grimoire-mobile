name: Feature request
description: Propose a focused mobile feature or compatibility improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    attributes:
      label: Problem
      description: What mobile workflow is difficult today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result and compatibility expectations.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Compatibility
      options:
        - label: This request should preserve existing legacy GBot files.
          required: true
